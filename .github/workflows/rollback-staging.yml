name: Rollback staging

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: 'Deployment ID to roll back to (leave empty to use the successful deployment before the current one)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: rollback-town-api-staging
  cancel-in-progress: false

jobs:
  rollback-staging:
    name: Roll back town-api-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: DEBUG - introspect deploymentRollback mutation
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway api \
            '{ __type(name: "Mutation") { fields(includeDeprecated: true) { name args { name type { kind name ofType { kind name ofType { kind name } } } } type { kind name ofType { kind name } } } } }' \
            --allow-errors \
            --compact \
            | node -e "
              const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              const f = d.data.__type.fields.find((x) => x.name === 'deploymentRollback');
              console.log(JSON.stringify(f, null, 2));
            "

      - name: Resolve target deployment
        id: target
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          DEPLOYMENT_ID_INPUT: ${{ github.event.inputs.deployment_id }}
        run: |
          set -euo pipefail
          if [[ -n "${DEPLOYMENT_ID_INPUT}" ]]; then
            echo "Using explicitly provided deployment id: ${DEPLOYMENT_ID_INPUT}"
            echo "id=${DEPLOYMENT_ID_INPUT}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Two real live-test failures both came back "Railway API request
          # failed with HTTP 400 Bad Request" -- a malformed request, not a
          # canRollback/pruning issue as first assumed (that theory was
          # never actually confirmed against these logs). Suspected cause:
          # `--var input={...}` handing the CLI a JSON *object* value is
          # unreliable; `--variables` is the documented, unambiguous way to
          # pass a full variables object. Also dropped the `status` filter
          # (unverified against the live schema) in favor of filtering by
          # status client-side below.
          RESPONSE=$(railway api \
            'query($input: DeploymentListInput!) { deployments(input: $input, first: 15) { edges { node { id status createdAt canRollback } } } }' \
            --variables '{"input":{"projectId":"8fd67de0-2ed1-4906-bf5a-36207191c613","serviceId":"b8f13b10-4207-4196-a301-3daa1db178af","environmentId":"a7e3d77f-269e-432c-b2e3-c2d777ee668a"}}' \
            --allow-errors \
            --compact)
          echo "$RESPONSE"
          # Skip index 0 (the current deployment) and take the first
          # candidate with canRollback=true. Seen against a real response:
          # Railway reports canRollback=true on deployments whose status
          # has moved to REMOVED (superseded by a later deploy) -- REMOVED
          # here means "no longer active", not "not rollback-eligible".
          # Requiring status === 'SUCCESS' (the previous version of this
          # check) excluded every real candidate, since the *current*
          # deployment is the only one still reporting SUCCESS. Only
          # exclude statuses that were never a good release to begin with.
          PREV_ID=$(echo "$RESPONSE" | node -e "
            const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            if (d.errors) throw new Error('GraphQL errors: ' + JSON.stringify(d.errors));
            const edges = d.data.deployments.edges;
            const neverGood = new Set(['FAILED', 'CRASHED', 'SKIPPED']);
            const candidate = edges.slice(1).find((edge) => edge.node.canRollback === true && !neverGood.has(edge.node.status));
            if (!candidate) throw new Error('no rollback-eligible deployment found among the last ' + edges.length + ' deployments');
            console.log(candidate.node.id);
          ")
          echo "Resolved rollback-eligible deployment: ${PREV_ID}"
          echo "id=${PREV_ID}" >> "$GITHUB_OUTPUT"

      - name: Roll back
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          echo "Rolling back town-api-staging to deployment ${{ steps.target.outputs.id }}"
          RESPONSE=$(railway api \
            'mutation($id: String!) { deploymentRollback(id: $id) { id status } }' \
            --variables "{\"id\":\"${{ steps.target.outputs.id }}\"}" \
            --allow-errors \
            --compact)
          echo "$RESPONSE"
          echo "$RESPONSE" | node -e "
            const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            if (d.errors) throw new Error('GraphQL errors: ' + JSON.stringify(d.errors));
            if (!d.data || !d.data.deploymentRollback || !d.data.deploymentRollback.id) throw new Error('unexpected response shape: ' + JSON.stringify(d));
          "

      - name: Wait for staging to become ready
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            STATUS=$(curl -sS -o /dev/null -w '%{http_code}' https://api-staging.towncivic.org/health/ready || echo 000)
            if [[ "${STATUS}" == "200" ]]; then
              echo "Ready after $((i * 5))s"
              exit 0
            fi
            echo "Attempt ${i}: status ${STATUS}, retrying..."
            sleep 5
          done
          echo "::error::Staging did not become ready within the wait window"
          exit 1

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm rolled-back deployment health/build
        run: |
          npm run smoke:deployment -- \
            --base-url https://api-staging.towncivic.org \
            --environment staging \
            --authorized-origin https://towncivic.org \
            --unauthorized-origin https://smoke-test-unauthorized.invalid
