name: Production restore drill

# Etapa 3 (Backup and restore) of the TOWN deployment plan.
#
# Restores the production Postgres PITR archive into a brand-new, isolated
# sibling service, validates data integrity there, then deletes both the
# sibling and the validator. Per Railway's PITR design, the source service
# is never touched and never serves the restored data -- see
# docs/operations/RESTORE_DRILL_RUNBOOK.md for the full write-up of why
# this is safe and how to run it by hand.
#
# Validation reaches the restored sibling over Railway's private network
# (<service>.railway.internal), not an external SSH tunnel. Multiple live
# runs confirmed `railway connect --tunnel-only` from a GitHub Actions
# runner is unreliable specifically against freshly PITR-restored sibling
# services (the tunnel opens, but the connection is dropped before ever
# reaching Postgres, confirmed by a tunnel diagnostic against an ordinary
# service working fine). A throwaway validator deployed as an ordinary
# Railway service in the same project+environment reaches the sibling the
# same way the real town-api service reaches Postgres-9UWs -- proven end
# to end in a live investigation run, all 22 integrity checks passing
# within a second of container start. Creating/configuring/deleting that
# validator happens via `railway api` (raw GraphQL) since the CLI has no
# `service create` subcommand -- schema confirmed via introspection
# (`railway api describe`/`search`), not guessed.

on:
  workflow_dispatch:
    inputs:
      restore_minutes_ago:
        description: 'How many minutes before now to target for the restore point (most recent healthy point by default)'
        required: false
        type: string
        default: '3'

permissions:
  contents: read

concurrency:
  group: restore-drill-town-api-production-postgres
  cancel-in-progress: false

jobs:
  restore-drill:
    name: Isolated PITR restore drill (production Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      SOURCE_SERVICE: Postgres-9UWs
      RAILWAY_PROJECT_ID: 8fd67de0-2ed1-4906-bf5a-36207191c613
      RAILWAY_ENVIRONMENT: production
      RAILWAY_ENVIRONMENT_ID: d6297195-3013-441d-b19f-e9fcfbb62b24
      VALIDATOR_REPO: michaeltofan/town-api
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: PITR status (read-only)
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
        run: |
          set -euo pipefail
          railway postgres pitr status \
            --service "$SOURCE_SERVICE" \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT"

      - name: Restore to an isolated sibling service
        id: restore
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
        run: |
          set -euo pipefail
          RESTORE_POINT_AT=$(date -u -d "${{ github.event.inputs.restore_minutes_ago || '3' }} minutes ago" '+%Y-%m-%dT%H:%M:%SZ')
          DRILL_START=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          NEW_SERVICE_NAME="restore-drill-${{ github.run_id }}"
          echo "restore_point_at=${RESTORE_POINT_AT}" >> "$GITHUB_OUTPUT"
          echo "drill_start=${DRILL_START}" >> "$GITHUB_OUTPUT"
          echo "new_service_name=${NEW_SERVICE_NAME}" >> "$GITHUB_OUTPUT"
          echo "Restoring '${SOURCE_SERVICE}' to ${RESTORE_POINT_AT} as isolated sibling '${NEW_SERVICE_NAME}'"
          # Async: starts a background createServiceFromPITR workflow and
          # returns immediately. The next step polls for actual readiness.
          railway postgres pitr restore \
            --service "$SOURCE_SERVICE" \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --at "$RESTORE_POINT_AT" \
            --new-service-name "$NEW_SERVICE_NAME" \
            --yes

      - name: Wait for Postgres to report itself ready (via deploy logs, not a tunnel)
        id: wait
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
          NEW_SERVICE_NAME: ${{ steps.restore.outputs.new_service_name }}
        run: |
          set -euo pipefail
          READY=""
          # Two live runs confirmed Postgres itself becomes ready in
          # 8-15 minutes; the previous 80-minute external-tunnel timeouts
          # were caused by the tunnel path (now removed), not by this.
          DEADLINE=$(( $(date -u +%s) + 30 * 60 ))
          attempt=0
          while [[ "$(date -u +%s)" -lt "$DEADLINE" ]]; do
            attempt=$((attempt + 1))
            REMAINING_MIN=$(( (DEADLINE - $(date -u +%s)) / 60 ))
            echo "Attempt ${attempt}: checking ${NEW_SERVICE_NAME} deploy logs for readiness (~${REMAINING_MIN}min left)..."
            if railway logs \
                --service "$NEW_SERVICE_NAME" \
                --project "$RAILWAY_PROJECT_ID" \
                --environment "$RAILWAY_ENVIRONMENT" \
                --lines 300 2>/dev/null | grep -q 'database system is ready to accept connections'; then
              READY=1
              break
            fi
            sleep 20
          done
          if [[ -z "$READY" ]]; then
            echo "::group::Deploy logs for ${NEW_SERVICE_NAME} (diagnostic)"
            railway logs \
              --service "$NEW_SERVICE_NAME" \
              --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT" \
              --lines 200 || echo "Could not fetch deploy logs"
            echo "::endgroup::"
            echo "::group::Build logs for ${NEW_SERVICE_NAME}"
            railway logs \
              --service "$NEW_SERVICE_NAME" \
              --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT" \
              --build \
              --lines 200 || echo "Could not fetch build logs"
            echo "::endgroup::"
            echo "::error::${NEW_SERVICE_NAME} never reported readiness within the wait window"
            exit 1
          fi
          echo "${NEW_SERVICE_NAME} is ready to accept connections."

      - name: Deploy a validator into the same project, reachable over private networking only
        id: validate
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
          NEW_SERVICE_NAME: ${{ steps.restore.outputs.new_service_name }}
        run: |
          set -euo pipefail

          # Built at runtime from separate pieces, never written literally
          # as a contiguous dollar-brace-brace sequence -- GitHub Actions'
          # own expression scanner reads the raw YAML text (comments
          # included) before bash ever runs, so writing that sequence
          # anywhere in this file, even inside a comment, gets parsed as an
          # expression and fails. Confirmed the hard way earlier in this
          # same effort.
          DOLLAR='$'
          BRACE='{'
          DATABASE_URL_REF="${DOLLAR}${BRACE}${BRACE}${NEW_SERVICE_NAME}.DATABASE_URL}}"

          VALIDATOR_NAME="restore-drill-validator-${{ github.run_id }}"
          echo "validator_name=${VALIDATOR_NAME}" >> "$GITHUB_OUTPUT"

          # 1. Create the validator service, sourced from this repo, with
          #    its DATABASE_URL set to a Railway private-network reference
          #    variable pointing at the restored sibling -- resolved by
          #    Railway at deploy time, never touches this job's own logs.
          CREATE_INPUT=$(VALIDATOR_NAME="$VALIDATOR_NAME" DATABASE_URL_REF="$DATABASE_URL_REF" node -e "
            console.log(JSON.stringify({
              input: {
                projectId: process.env.RAILWAY_PROJECT_ID,
                environmentId: process.env.RAILWAY_ENVIRONMENT_ID,
                name: process.env.VALIDATOR_NAME,
                source: { repo: process.env.VALIDATOR_REPO },
                branch: 'main',
                variables: { DATABASE_URL: process.env.DATABASE_URL_REF },
              },
            }));
          ")
          CREATE_RESPONSE=$(railway api \
            'mutation($input: ServiceCreateInput!) { serviceCreate(input: $input) { id name } }' \
            --variables "$CREATE_INPUT" \
            --allow-errors \
            --compact)
          echo "$CREATE_RESPONSE"
          VALIDATOR_ID=$(echo "$CREATE_RESPONSE" | node -e "
            const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            if (d.errors) throw new Error('serviceCreate GraphQL errors: ' + JSON.stringify(d.errors));
            const id = d.data?.serviceCreate?.id;
            if (!id) throw new Error('unexpected serviceCreate response shape: ' + JSON.stringify(d));
            console.log(id);
          ")
          echo "validator_id=${VALIDATOR_ID}" >> "$GITHUB_OUTPUT"
          echo "Created validator service ${VALIDATOR_NAME} (${VALIDATOR_ID})"

          # 2. Configure it: run the compiled, production-safe validator
          #    entrypoint and exit -- never restart on exit (it's a one-shot
          #    check, not a server).
          UPDATE_INPUT='{"serviceId":"'"$VALIDATOR_ID"'","environmentId":"'"$RAILWAY_ENVIRONMENT_ID"'","input":{"startCommand":"node dist/scripts/restore-drill-validate.js","restartPolicyType":"NEVER"}}'
          UPDATE_RESPONSE=$(railway api \
            'mutation($serviceId: String!, $environmentId: String, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(serviceId: $serviceId, environmentId: $environmentId, input: $input) }' \
            --variables "$UPDATE_INPUT" \
            --allow-errors \
            --compact)
          echo "$UPDATE_RESPONSE"
          echo "$UPDATE_RESPONSE" | node -e "
            const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            if (d.errors) throw new Error('serviceInstanceUpdate GraphQL errors: ' + JSON.stringify(d.errors));
            if (d.data?.serviceInstanceUpdate !== true) throw new Error('unexpected serviceInstanceUpdate response shape: ' + JSON.stringify(d));
          "

          # 3. Deploy it -- first deploy for this service, now correctly
          #    configured from the start (no wasted build-then-redeploy
          #    cycle).
          DEPLOY_INPUT='{"environmentId":"'"$RAILWAY_ENVIRONMENT_ID"'","serviceId":"'"$VALIDATOR_ID"'"}'
          DEPLOY_RESPONSE=$(railway api \
            'mutation($environmentId: String!, $serviceId: String!) { serviceInstanceDeployV2(environmentId: $environmentId, serviceId: $serviceId) }' \
            --variables "$DEPLOY_INPUT" \
            --allow-errors \
            --compact)
          echo "$DEPLOY_RESPONSE"
          DEPLOYMENT_ID=$(echo "$DEPLOY_RESPONSE" | node -e "
            const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            if (d.errors) throw new Error('serviceInstanceDeployV2 GraphQL errors: ' + JSON.stringify(d.errors));
            const id = d.data?.serviceInstanceDeployV2;
            if (!id) throw new Error('unexpected serviceInstanceDeployV2 response shape: ' + JSON.stringify(d));
            console.log(id);
          ")
          echo "Deployment ${DEPLOYMENT_ID} triggered for ${VALIDATOR_NAME}"

          # 4. Poll for a terminal status.
          TERMINAL=""
          STATUS=""
          for tick in $(seq 1 60); do
            STATUS_RESPONSE=$(railway api \
              'query($id: String!) { deployment(id: $id) { status } }' \
              --variables "{\"id\":\"${DEPLOYMENT_ID}\"}" \
              --allow-errors \
              --compact)
            STATUS=$(echo "$STATUS_RESPONSE" | node -e "
              const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              if (d.errors) throw new Error('deployment query GraphQL errors: ' + JSON.stringify(d.errors));
              console.log(d.data?.deployment?.status ?? 'UNKNOWN');
            ")
            echo "Deployment status: ${STATUS}"
            case "$STATUS" in
              SUCCESS|FAILED|CRASHED|REMOVED)
                TERMINAL=1
                break
                ;;
            esac
            sleep 5
          done
          if [[ -z "$TERMINAL" ]]; then
            echo "::error::Validator deployment never reached a terminal status (last: ${STATUS})"
            echo "outcome=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # 5. Read the validator's own deploy logs for the JSON summary.
          #    Railway's log pipeline parses JSON stdout lines into
          #    structured attributes rather than keeping a single message
          #    string, confirmed against a live run -- read attributes, not
          #    message.
          LOGS_RESPONSE=$(railway api \
            'query($deploymentId: String!, $limit: Int) { deploymentLogs(deploymentId: $deploymentId, limit: $limit) { message severity attributes { key value } } }' \
            --variables "{\"deploymentId\":\"${DEPLOYMENT_ID}\",\"limit\":200}" \
            --allow-errors \
            --compact)
          echo "$LOGS_RESPONSE" | node -e "
            const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            if (d.errors) throw new Error('deploymentLogs GraphQL errors: ' + JSON.stringify(d.errors));
            const logs = d.data?.deploymentLogs ?? [];
            const attrs = {};
            for (const log of logs) {
              for (const a of (log.attributes || [])) {
                if (a.key === 'outcome' || a.key === 'checks' || a.key === 'counts') {
                  attrs[a.key] = a.value;
                }
              }
            }
            if (!attrs.outcome) {
              console.error('No validation summary found in deploy logs (raw logs): ' + JSON.stringify(logs));
              process.exit(1);
            }
            console.log('outcome=' + JSON.parse(attrs.outcome));
            console.log('checks=' + (attrs.checks ?? '[]'));
            console.log('counts=' + (attrs.counts ?? '{}'));
          " > validate_result.txt || { cat validate_result.txt 2>/dev/null; echo "outcome=failed" >> "$GITHUB_OUTPUT"; exit 1; }
          cat validate_result.txt
          OUTCOME=$(grep '^outcome=' validate_result.txt | cut -d= -f2-)
          echo "Validation outcome: ${OUTCOME}"
          echo "outcome=${OUTCOME}" >> "$GITHUB_OUTPUT"
          if [[ "$OUTCOME" != "passed" ]]; then
            exit 1
          fi

      - name: Report RPO / RTO and attestation values
        if: always()
        env:
          RESTORE_POINT_AT: ${{ steps.restore.outputs.restore_point_at }}
          DRILL_START: ${{ steps.restore.outputs.drill_start }}
          OUTCOME: ${{ steps.validate.outputs.outcome || 'failed' }}
        run: |
          set -euo pipefail
          DRILL_END=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          RPO_SECONDS=$(( $(date -u -d "$DRILL_START" +%s) - $(date -u -d "$RESTORE_POINT_AT" +%s) ))
          RTO_SECONDS=$(( $(date -u -d "$DRILL_END" +%s) - $(date -u -d "$DRILL_START" +%s) ))
          echo "restore_point_at=${RESTORE_POINT_AT}"
          echo "drill_start=${DRILL_START}"
          echo "drill_end=${DRILL_END}"
          echo "rpo_seconds=${RPO_SECONDS}"
          echo "rto_seconds=${RTO_SECONDS}"
          echo "outcome=${OUTCOME}"
          echo ""
          echo "Attestation body for POST /v1/platform/restore/attest (submit with an ops_admin+ operator session):"
          echo "{\"method\":\"railway_pitr_point_in_time\",\"outcome\":\"${OUTCOME}\",\"restorePointAt\":\"${RESTORE_POINT_AT}\",\"note\":\"drill run ${{ github.run_id }}; RPO=${RPO_SECONDS}s RTO=${RTO_SECONDS}s\"}"

      - name: Delete the isolated restored service and the validator (always runs)
        if: always()
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
          NEW_SERVICE_NAME: ${{ steps.restore.outputs.new_service_name }}
          VALIDATOR_NAME: ${{ steps.validate.outputs.validator_name }}
        run: |
          set -euo pipefail
          for name in "$NEW_SERVICE_NAME" "$VALIDATOR_NAME"; do
            if [[ -z "$name" ]]; then
              continue
            fi
            echo "Deleting service: ${name}"
            railway service delete \
              --service "$name" \
              --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT" \
              --yes || echo "::warning::Failed to delete ${name} -- delete it manually from the Railway dashboard"
          done
