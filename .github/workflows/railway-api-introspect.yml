name: Railway API introspection (temporary)

# Read-only schema introspection for the final Etapa 3 closing drill. The
# closing drill needs to create/configure/delete a throwaway validator
# service entirely from within a single GitHub Actions run (no live
# operator via chat/MCP, per "pasii trebuie sa poata fi repetati fara
# informatii din chat"). The Railway CLI has no `service create` command,
# so this must go through `railway api` (raw GraphQL), same escape hatch
# already used in rollback-staging.yml -- and that workflow's own history
# shows guessing field/mutation names caused two real failures before
# schema introspection fixed it. This workflow only reads the schema, no
# mutations. Delete once the closing drill is built and working.
#
# First round (describe Mutation / ServiceCreateInput /
# ServiceInstanceUpdateInput, search service / deployment / variable)
# already confirmed: serviceCreate(input: ServiceCreateInput!) -> Service!,
# serviceDelete(id: String!, environmentId: String) -> Boolean!,
# serviceInstanceUpdate(serviceId: String!, input: ServiceInstanceUpdateInput!,
# environmentId: String) -> Boolean!, deploymentLogs(deploymentId: String!,
# filter, limit, startDate, endDate) -> [Log!]!. Still need
# ServiceSourceInput (for pointing serviceCreate at the town-api GitHub
# repo) and VariableUpsertInput (for setting the validator's DATABASE_URL
# reference variable) -- this round is scoped to just those two, to keep
# the job (and its Actions-minutes cost) small.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  introspect:
    name: Print remaining Railway API schema sections
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Describe ServiceSourceInput
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
        run: railway api describe ServiceSourceInput || true

      - name: Describe VariableUpsertInput
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
        run: railway api describe VariableUpsertInput || true
