name: CI

on:
  push:
    branches:
      - main
      - cursor/**
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit, integration, openapi, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: town_ci
          POSTGRES_PASSWORD: town_ci
          POSTGRES_DB: town_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U town_ci -d town_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://town_ci:town_ci@127.0.0.1:5432/town_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Wait for PostgreSQL 18
        run: |
          node --input-type=module <<'EOF'
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL, max: 1, connectionTimeoutMillis: 2000 });
          for (let attempt = 1; attempt <= 30; attempt += 1) {
            try {
              await pool.query('SELECT 1');
              await pool.end();
              console.log('PostgreSQL is ready');
              process.exit(0);
            } catch {
              await new Promise((resolve) => setTimeout(resolve, 1000));
            }
          }
          await pool.end().catch(() => undefined);
          console.error('PostgreSQL did not become ready');
          process.exit(1);
          EOF

      - name: Database migration check
        run: npm run db:check

      - name: Database migration test
        run: npm run db:migrate:test

      - name: PostgreSQL integration tests
        run: npm run test:integration

      - name: OpenAPI check
        run: npm run openapi:check

      - name: Build
        run: npm run build
