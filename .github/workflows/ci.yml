name: CI

on:
  push:
    branches:
      - main
      - cursor/**
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit, integration, openapi, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: town_ci
          POSTGRES_PASSWORD: town_ci
          POSTGRES_DB: town_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U town_ci -d town_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://town_ci:town_ci@127.0.0.1:5432/town_ci
      # Isolated CI-only placeholders for email verification tests (not GitHub secrets).
      EMAIL_VERIFICATION_ENABLED: 'true'
      EMAIL_VERIFICATION_HASH_KEY: town-ci-email-verification-hash-key-32b
      CEREMONY_RATE_LIMIT_HASH_KEY: town-ci-ceremony-rate-limit-hash-key-32b
      EMAIL_VERIFICATION_DELIVERY_MODE: test
      # CI-only localhost WebAuthn placeholders for passkey registration tests.
      WEBAUTHN_REGISTRATION_ENABLED: 'true'
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_NAME: TOWN
      WEBAUTHN_ALLOWED_ORIGINS: http://localhost:3000
      WEBAUTHN_CHALLENGE_HASH_KEY: town-ci-webauthn-challenge-hash-key-32by
      # CI-only localhost passkey authentication/session placeholders.
      PASSKEY_AUTHENTICATION_ENABLED: 'true'
      PASSKEY_AUTHENTICATION_CHALLENGE_HASH_KEY: town-ci-passkey-auth-challenge-hash-key32
      SESSION_TOKEN_HASH_KEY: town-ci-session-token-hash-key-32bytesxx
      WEB_SESSION_COOKIE_NAME: __Host-Http-town_session
      # CI-only account recovery placeholders (test delivery only).
      ACCOUNT_RECOVERY_ENABLED: 'true'
      ACCOUNT_RECOVERY_HASH_KEY: town-ci-account-recovery-hash-key-32byt
      ACCOUNT_RECOVERY_TOKEN_HASH_KEY: town-ci-account-recovery-token-key-32b
      ACCOUNT_RECOVERY_DELIVERY_MODE: test
      TRUST_PROXY: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Wait for PostgreSQL 18
        run: |
          node --input-type=module <<'EOF'
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL, max: 1, connectionTimeoutMillis: 2000 });
          for (let attempt = 1; attempt <= 30; attempt += 1) {
            try {
              await pool.query('SELECT 1');
              await pool.end();
              console.log('PostgreSQL is ready');
              process.exit(0);
            } catch {
              await new Promise((resolve) => setTimeout(resolve, 1000));
            }
          }
          await pool.end().catch(() => undefined);
          console.error('PostgreSQL did not become ready');
          process.exit(1);
          EOF

      - name: Database migration check
        run: npm run db:check

      - name: Database migration test
        run: npm run db:migrate:test

      - name: Foundation and controlled actor seeds
        run: |
          npm run db:migrate
          npm run db:seed:foundation
          npm run db:seed:foundation
          npm run db:seed:controlled-actor
          npm run db:seed:controlled-actor

      - name: Verify canonical seed counts
        run: |
          node --input-type=module <<'EOF'
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL, max: 1 });
          const communities = await pool.query('SELECT COUNT(*)::int AS count FROM town.communities');
          const signals = await pool.query('SELECT COUNT(*)::int AS count FROM town.signals');
          const actors = await pool.query('SELECT COUNT(*)::int AS count FROM town.actors');
          const confirmations = await pool.query('SELECT COUNT(*)::int AS count FROM town.signal_confirmations');
          const controlled = await pool.query(
            `SELECT id, kind, status, community_id, account_id
             FROM town.actors
             WHERE id = '00000000-0000-4000-8000-000000000301'`,
          );
          await pool.end();
          if (communities.rows[0].count !== 2 || signals.rows[0].count !== 6) {
            console.error('Unexpected canonical counts', communities.rows[0], signals.rows[0]);
            process.exit(1);
          }
          if (actors.rows[0].count !== 1 || confirmations.rows[0].count !== 0) {
            console.error('Unexpected actor/confirmation counts', actors.rows[0], confirmations.rows[0]);
            process.exit(1);
          }
          if (
            controlled.rows.length !== 1 ||
            controlled.rows[0].kind !== 'controlled_test' ||
            controlled.rows[0].status !== 'active' ||
            controlled.rows[0].community_id !== '00000000-0000-4000-8000-000000000001' ||
            controlled.rows[0].account_id !== null
          ) {
            console.error('Unexpected controlled actor', controlled.rows[0]);
            process.exit(1);
          }
          console.log('Canonical seed counts OK: communities=2 signals=6 actors=1 confirmations=0');
          EOF

      - name: PostgreSQL integration tests
        run: npm run test:integration

      - name: OpenAPI check
        run: npm run openapi:check

      - name: Identity contract check
        run: npm run identity:contract:check

      - name: Authentication ceremony contract check
        run: npm run auth:contract:check

      - name: Membership contract check
        run: npm run membership:contract:check

      - name: Build
        run: npm run build

      - name: npm audit
        # Full install reports known moderate drizzle-kit/@esbuild-kit findings (dev-only).
        # Do not force-fix; production audit below must stay clean.
        run: npm audit
        continue-on-error: true

      - name: npm audit omit dev
        run: npm audit --omit=dev
