name: CI

on:
  push:
    branches:
      - main
      - cursor/**
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Deploy to production (requires explicit GO — leave false to just run tests/staging)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit, integration, openapi, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: town_ci
          POSTGRES_PASSWORD: town_ci
          POSTGRES_DB: town_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U town_ci -d town_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://town_ci:town_ci@127.0.0.1:5432/town_ci
      # Deployment Readiness V1: pin runtime identity for tests and smoke tooling.
      APP_ENV: test
      APP_COMMIT_SHA: ${{ github.sha }}
      READINESS_TIMEOUT_MS: '3000'
      GRACEFUL_SHUTDOWN_TIMEOUT_MS: '10000'
      # Isolated CI-only placeholders for email verification tests (not GitHub secrets).
      EMAIL_VERIFICATION_ENABLED: 'true'
      EMAIL_VERIFICATION_HASH_KEY: town-ci-email-verification-hash-key-32b
      CEREMONY_RATE_LIMIT_HASH_KEY: town-ci-ceremony-rate-limit-hash-key-32b
      EMAIL_VERIFICATION_DELIVERY_MODE: test
      # CI-only localhost WebAuthn placeholders for passkey registration tests.
      WEBAUTHN_REGISTRATION_ENABLED: 'true'
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_NAME: TOWN
      WEBAUTHN_ALLOWED_ORIGINS: http://localhost:3000
      WEBAUTHN_CHALLENGE_HASH_KEY: town-ci-webauthn-challenge-hash-key-32by
      # CI-only localhost passkey authentication/session placeholders.
      PASSKEY_AUTHENTICATION_ENABLED: 'true'
      PASSKEY_AUTHENTICATION_CHALLENGE_HASH_KEY: town-ci-passkey-auth-challenge-hash-key32
      SESSION_TOKEN_HASH_KEY: town-ci-session-token-hash-key-32bytesxx
      WEB_SESSION_COOKIE_NAME: __Host-Http-town_session
      # CI-only account recovery placeholders (test delivery only).
      ACCOUNT_RECOVERY_ENABLED: 'true'
      ACCOUNT_RECOVERY_HASH_KEY: town-ci-account-recovery-hash-key-32byt
      ACCOUNT_RECOVERY_TOKEN_HASH_KEY: town-ci-account-recovery-token-key-32b
      ACCOUNT_RECOVERY_DELIVERY_MODE: test
      # CI-only initial password-setup ceremony gate.
      PASSWORD_AUTH_ENABLED: 'true'
      # CI-only isolated Stripe billing placeholders (never Stripe live secrets; fake adapter drives tests).
      STRIPE_BILLING_ENABLED: 'true'
      STRIPE_SECRET_KEY: sk_test_town_ci_fake_stripe_secret_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_town_ci_fake_stripe_webhook_secret_placeholder
      STRIPE_ANNUAL_PRICE_ID: price_town_ci_annual_placeholder
      STRIPE_PORTAL_CONFIGURATION_ID: bpc_town_ci_portal_configuration_placeholder
      STRIPE_CHECKOUT_SUCCESS_URL: https://example.test/checkout/success
      STRIPE_CHECKOUT_CANCEL_URL: https://example.test/checkout/cancel
      STRIPE_PORTAL_RETURN_URL: https://example.test/portal/return
      STRIPE_API_VERSION: 2026-06-24.dahlia
      STRIPE_EXPECTED_LIVEMODE: 'false'
      TRUST_PROXY: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Wait for PostgreSQL 18
        run: |
          node --input-type=module <<'EOF'
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL, max: 1, connectionTimeoutMillis: 2000 });
          for (let attempt = 1; attempt <= 30; attempt += 1) {
            try {
              await pool.query('SELECT 1');
              await pool.end();
              console.log('PostgreSQL is ready');
              process.exit(0);
            } catch {
              await new Promise((resolve) => setTimeout(resolve, 1000));
            }
          }
          await pool.end().catch(() => undefined);
          console.error('PostgreSQL did not become ready');
          process.exit(1);
          EOF

      - name: Database migration check
        run: npm run db:check

      - name: Database migration test
        run: npm run db:migrate:test

      - name: Foundation and controlled actor seeds
        run: |
          npm run db:migrate
          npm run db:seed:foundation
          npm run db:seed:foundation
          npm run db:seed:controlled-actor
          npm run db:seed:controlled-actor

      - name: Migration ledger verify
        run: npm run db:migrate:verify

      - name: Verify canonical seed counts
        run: |
          node --input-type=module <<'EOF'
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL, max: 1 });
          const communities = await pool.query('SELECT COUNT(*)::int AS count FROM town.communities');
          const signals = await pool.query('SELECT COUNT(*)::int AS count FROM town.signals');
          const actors = await pool.query('SELECT COUNT(*)::int AS count FROM town.actors');
          const confirmations = await pool.query('SELECT COUNT(*)::int AS count FROM town.signal_confirmations');
          const controlled = await pool.query(
            `SELECT id, kind, status, community_id, account_id
             FROM town.actors
             WHERE id = '00000000-0000-4000-8000-000000000301'`,
          );
          await pool.end();
          if (communities.rows[0].count !== 22 || signals.rows[0].count !== 66) {
            console.error('Unexpected canonical counts', communities.rows[0], signals.rows[0]);
            process.exit(1);
          }
          if (actors.rows[0].count !== 1 || confirmations.rows[0].count !== 0) {
            console.error('Unexpected actor/confirmation counts', actors.rows[0], confirmations.rows[0]);
            process.exit(1);
          }
          if (
            controlled.rows.length !== 1 ||
            controlled.rows[0].kind !== 'controlled_test' ||
            controlled.rows[0].status !== 'active' ||
            controlled.rows[0].community_id !== '00000000-0000-4000-8000-000000000001' ||
            controlled.rows[0].account_id !== null
          ) {
            console.error('Unexpected controlled actor', controlled.rows[0]);
            process.exit(1);
          }
          console.log('Canonical seed counts OK: communities=22 signals=66 actors=1 confirmations=0');
          EOF

      - name: PostgreSQL integration tests
        run: npm run test:integration

      - name: OpenAPI check
        run: npm run openapi:check

      - name: Identity contract check
        run: npm run identity:contract:check

      - name: Authentication ceremony contract check
        run: npm run auth:contract:check

      - name: Membership contract check
        run: npm run membership:contract:check

      - name: Billing contract check
        run: npm run billing:contract:check

      - name: Media contract check
        run: npm run media:contract:check

      - name: Build
        run: npm run build

      - name: npm audit
        # Full install reports known moderate drizzle-kit/@esbuild-kit findings (dev-only).
        # Do not force-fix; production audit below must stay clean.
        run: npm audit
        continue-on-error: true

      - name: npm audit omit dev
        run: npm audit --omit=dev

  deploy-staging:
    name: Deploy to staging (Railway)
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: deploy-town-api-staging
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Set deployment commit identity
        # `railway up` uploads a local snapshot instead of triggering a
        # GitHub-linked build, so Railway never injects RAILWAY_GIT_COMMIT_SHA
        # for this deploy. Per docs/operations/DEPLOYMENT_READINESS_V1.md,
        # CI/non-Git deploy mechanisms must set APP_COMMIT_SHA explicitly, or
        # the app refuses to boot (env.ts requires one of the two in staging).
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway variable set "APP_COMMIT_SHA=${{ github.sha }}" --service town-api-staging --skip-deploys

      - name: Deploy town-api-staging
        # Deliberately not using --ci: attached mode blocks until the
        # deployment reaches a terminal status and exits non-zero on
        # failure (build failure, migration failure, or failed healthcheck).
        # This is what makes the job an honest CI gate instead of a
        # fire-and-forget trigger.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service town-api-staging

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Smoke test deployed staging
        # docs/operations/DEPLOYMENT_READINESS_V1.md step 7: health, build
        # identity + commit match, unauthenticated route returns 401, CORS
        # (authorized/unauthorized/preflight), Stripe webhook signature
        # rejection, and a scan for leaked secret sentinels. Railway's own
        # preDeployCommand + /health/ready healthcheck already gate the
        # rollout itself; this is the independent, CI-visible confirmation
        # that the live deployment actually behaves as expected — and it
        # fails the job (not just a log line) if it doesn't.
        run: |
          npm run smoke:deployment -- \
            --base-url https://api-staging.towncivic.org \
            --environment staging \
            --expect-commit "${{ github.sha }}" \
            --authorized-origin https://towncivic.org \
            --unauthorized-origin https://smoke-test-unauthorized.invalid

  deploy-production:
    name: Deploy to production (Railway)
    # Deliberately NOT triggered by push, and NOT by a bare workflow_dispatch
    # either: a plain "Run workflow" click (e.g. to re-run the test suite)
    # must never deploy production as a side effect. The equivalent job in
    # town-public's e2e.yml bit us for real this way — re-running that
    # workflow to repeat the E2E suite silently redeployed production,
    # because at the time it only checked the event name. Production now
    # requires the deploy_production input to be explicitly set to true on
    # top of workflow_dispatch, so a human has to opt in on that specific
    # run. `quality` re-runs fresh in that same manual run since
    # workflow_dispatch is not filtered out of its trigger.
    needs: quality
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_production == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-town-api-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Set deployment commit identity
        # See the equivalent step in deploy-staging: `railway up` deploys
        # don't get RAILWAY_GIT_COMMIT_SHA from Railway, so APP_COMMIT_SHA
        # must be set explicitly or the app refuses to boot.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway variable set "APP_COMMIT_SHA=${{ github.sha }}" --service town-api --skip-deploys

      - name: Deploy town-api (production)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service town-api

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Smoke test deployed production
        # See the equivalent step in deploy-staging for what this covers.
        run: |
          npm run smoke:deployment -- \
            --base-url https://api.towncivic.org \
            --environment production \
            --expect-commit "${{ github.sha }}" \
            --authorized-origin https://towncivic.org \
            --unauthorized-origin https://smoke-test-unauthorized.invalid
