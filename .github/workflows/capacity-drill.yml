name: Etapa 4 capacity drill

# Etapa 4 (Capacitate pentru 1.000 de utilizatori) of the TOWN deployment
# plan. Targets a permanent, dedicated Railway environment named `capacity`
# (project town-public, environment id b1cd4997-02b8-4103-bd64-bfc970e0e7cc)
# containing exactly two services: an official-template Postgres and
# `town-api-capacity` (this repo, branch main). Neither is created or
# deleted by this workflow -- both are standing infrastructure, provisioned
# once by hand (see docs/operations/CAPACITY_DRILL_RUNBOOK.md).
#
# This replaces an earlier design that created and destroyed a temporary
# Postgres + API service on every run via raw `serviceCreate`/`volumeCreate`
# GraphQL calls. Two real dispatches of that design failed on Railway
# infrastructure races (a missing volume, then a stale deployment snapshot)
# before ever reaching the k6 step -- neither failure said anything about
# TOWN's actual capacity. Provisioning a stable, permanent environment once
# and simply resetting its database between runs removes that entire class
# of failure.
#
# Runs the capacity profile TWICE against this commit, back to back: reset
# the dedicated database schema, migrate, seed, provision fixtures, serve,
# run k6, verify. The second run only starts if the first fully passed.
# Never touches the shared Staging Postgres or production -- the schema
# reset refuses unconditionally unless Railway's own RAILWAY_ENVIRONMENT_NAME
# is exactly `capacity` (see resetCapacitySchema in
# src/platform/run-capacity-setup.ts).

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: capacity-drill-town-api-capacity-environment
  cancel-in-progress: false

jobs:
  capacity-drill:
    name: Capacity drill against the dedicated `capacity` environment (x2)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    env:
      RAILWAY_PROJECT_ID: 8fd67de0-2ed1-4906-bf5a-36207191c613
      RAILWAY_ENVIRONMENT: capacity
      RAILWAY_ENVIRONMENT_ID: b1cd4997-02b8-4103-bd64-bfc970e0e7cc
      API_SERVICE_ID: 992fd678-aa3c-4fe2-8295-921ec6c2f2a5
      API_SERVICE_NAME: town-api-capacity
      BASE_URL: https://town-api-capacity-capacity.up.railway.app
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_ACCOUNT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # ---------------------------------------------------------------
      # Run 1
      # ---------------------------------------------------------------

      - name: Run 1 -- setup (reset schema, migrate, seed, provision fixtures)
        id: run1_setup
        run: |
          set -euo pipefail
          UPDATE_INPUT='{"serviceId":"'"${API_SERVICE_ID}"'","environmentId":"'"${RAILWAY_ENVIRONMENT_ID}"'","input":{"startCommand":"node dist/scripts/capacity-setup.js","restartPolicyType":"NEVER"}}'
          UPDATE_RESPONSE=$(railway api \
            'mutation($serviceId: String!, $environmentId: String, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(serviceId: $serviceId, environmentId: $environmentId, input: $input) }' \
            --variables "$UPDATE_INPUT" \
            --allow-errors \
            --compact)
          echo "$UPDATE_RESPONSE"
          echo "$UPDATE_RESPONSE" | node -e "
            const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            if (d.errors) throw new Error('serviceInstanceUpdate GraphQL errors: ' + JSON.stringify(d.errors));
            if (d.data?.serviceInstanceUpdate !== true) throw new Error('unexpected serviceInstanceUpdate response shape: ' + JSON.stringify(d));
          "

          DEPLOY_INPUT='{"environmentId":"'"${RAILWAY_ENVIRONMENT_ID}"'","serviceId":"'"${API_SERVICE_ID}"'"}'
          DEPLOY_RESPONSE=$(railway api \
            'mutation($environmentId: String!, $serviceId: String!) { serviceInstanceDeployV2(environmentId: $environmentId, serviceId: $serviceId) }' \
            --variables "$DEPLOY_INPUT" \
            --allow-errors \
            --compact)
          echo "$DEPLOY_RESPONSE"
          DEPLOYMENT_ID=$(echo "$DEPLOY_RESPONSE" | node -e "
            const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            if (d.errors) throw new Error('serviceInstanceDeployV2 GraphQL errors: ' + JSON.stringify(d.errors));
            const id = d.data?.serviceInstanceDeployV2;
            if (!id) throw new Error('unexpected serviceInstanceDeployV2 response shape: ' + JSON.stringify(d));
            console.log(id);
          ")
          echo "Setup deployment ${DEPLOYMENT_ID} triggered"

          TERMINAL=""
          STATUS=""
          for tick in $(seq 1 240); do
            STATUS_RESPONSE=$(railway api \
              'query($id: String!) { deployment(id: $id) { status } }' \
              --variables "{\"id\":\"${DEPLOYMENT_ID}\"}" \
              --allow-errors \
              --compact)
            STATUS=$(echo "$STATUS_RESPONSE" | node -e "
              const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              if (d.errors) throw new Error('deployment query GraphQL errors: ' + JSON.stringify(d.errors));
              console.log(d.data?.deployment?.status ?? 'UNKNOWN');
            ")
            echo "Setup deployment status: ${STATUS}"
            case "$STATUS" in
              SUCCESS|FAILED|CRASHED|REMOVED)
                TERMINAL=1
                break
                ;;
            esac
            sleep 5
          done
          if [[ -z "$TERMINAL" ]]; then
            echo "::error::Run 1 setup deployment never reached a terminal status (last: ${STATUS})"
            exit 1
          fi

          RESULT_MARKER=""
          for attempt in $(seq 1 12); do
            LOGS_RESPONSE=$(railway api \
              'query($deploymentId: String!, $limit: Int) { deploymentLogs(deploymentId: $deploymentId, limit: $limit) { message severity attributes { key value } } }' \
              --variables "{\"deploymentId\":\"${DEPLOYMENT_ID}\",\"limit\":500}" \
              --allow-errors \
              --compact)
            RESULT_MARKER=$(echo "$LOGS_RESPONSE" | node -e "
              const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              if (d.errors) throw new Error('deploymentLogs GraphQL errors: ' + JSON.stringify(d.errors));
              const logs = d.data?.deploymentLogs ?? [];
              let marker;
              for (const log of logs) {
                for (const a of (log.attributes || [])) {
                  if (a.key === 'capacitySetupResult') {
                    marker = a.value;
                  }
                }
              }
              if (marker) process.stdout.write(marker);
            ")
            if [[ -n "$RESULT_MARKER" ]]; then
              break
            fi
            echo "capacitySetupResult marker not available yet (attempt ${attempt}/12); waiting 5 seconds..."
            sleep 5
          done
          if [[ -z "$RESULT_MARKER" ]]; then
            echo "::error::capacitySetupResult marker was not available within 60 seconds after deployment reached a terminal status"
            exit 1
          fi
          echo "$RESULT_MARKER" | node -e "
            const result = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            console.log('outcome=' + result.outcome);
            console.log('checks=' + JSON.stringify(result.checks ?? []));
            console.log('counts=' + JSON.stringify(result.counts ?? {}));
          " > run1-setup-result.txt
          cat run1-setup-result.txt
          OUTCOME=$(grep '^outcome=' run1-setup-result.txt | cut -d= -f2-)
          if [[ "$STATUS" != "SUCCESS" || "$OUTCOME" != "passed" ]]; then
            exit 1
          fi

      - name: Run 1 -- serve (boot the real API server)
        id: run1_serve
        run: |
          set -euo pipefail
          UPDATE_INPUT='{"serviceId":"'"${API_SERVICE_ID}"'","environmentId":"'"${RAILWAY_ENVIRONMENT_ID}"'","input":{"startCommand":"node dist/server.js","restartPolicyType":"ON_FAILURE"}}'
          UPDATE_RESPONSE=$(railway api \
            'mutation($serviceId: String!, $environmentId: String, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(serviceId: $serviceId, environmentId: $environmentId, input: $input) }' \
            --variables "$UPDATE_INPUT" \
            --allow-errors \
            --compact)
          echo "$UPDATE_RESPONSE"
          echo "$UPDATE_RESPONSE" | node -e "
            const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            if (d.errors) throw new Error('serviceInstanceUpdate GraphQL errors: ' + JSON.stringify(d.errors));
            if (d.data?.serviceInstanceUpdate !== true) throw new Error('unexpected serviceInstanceUpdate response shape: ' + JSON.stringify(d));
          "

          DEPLOY_INPUT='{"environmentId":"'"${RAILWAY_ENVIRONMENT_ID}"'","serviceId":"'"${API_SERVICE_ID}"'"}'
          DEPLOY_RESPONSE=$(railway api \
            'mutation($environmentId: String!, $serviceId: String!) { serviceInstanceDeployV2(environmentId: $environmentId, serviceId: $serviceId) }' \
            --variables "$DEPLOY_INPUT" \
            --allow-errors \
            --compact)
          echo "$DEPLOY_RESPONSE"
          DEPLOYMENT_ID=$(echo "$DEPLOY_RESPONSE" | node -e "
            const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            if (d.errors) throw new Error('serviceInstanceDeployV2 GraphQL errors: ' + JSON.stringify(d.errors));
            const id = d.data?.serviceInstanceDeployV2;
            if (!id) throw new Error('unexpected serviceInstanceDeployV2 response shape: ' + JSON.stringify(d));
            console.log(id);
          ")
          echo "Serve deployment ${DEPLOYMENT_ID} triggered"

          TERMINAL=""
          STATUS=""
          for tick in $(seq 1 120); do
            STATUS_RESPONSE=$(railway api \
              'query($id: String!) { deployment(id: $id) { status } }' \
              --variables "{\"id\":\"${DEPLOYMENT_ID}\"}" \
              --allow-errors \
              --compact)
            STATUS=$(echo "$STATUS_RESPONSE" | node -e "
              const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              if (d.errors) throw new Error('deployment query GraphQL errors: ' + JSON.stringify(d.errors));
              console.log(d.data?.deployment?.status ?? 'UNKNOWN');
            ")
            echo "Serve deployment status: ${STATUS}"
            case "$STATUS" in
              SUCCESS|FAILED|CRASHED|REMOVED)
                TERMINAL=1
                break
                ;;
            esac
            sleep 5
          done
          if [[ -z "$TERMINAL" || "$STATUS" != "SUCCESS" ]]; then
            echo "::group::Deploy logs (diagnostic)"
            railway logs --service "${API_SERVICE_NAME}" --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --lines 200 || true
            echo "::endgroup::"
            echo "::error::Run 1 serve deployment did not reach SUCCESS (last: ${STATUS})"
            exit 1
          fi

      - name: Run 1 -- wait for /health/ready
        run: |
          set -euo pipefail
          READY=""
          DEADLINE=$(( $(date -u +%s) + 5 * 60 ))
          while [[ "$(date -u +%s)" -lt "$DEADLINE" ]]; do
            BODY=$(curl -fsS "${BASE_URL}/health/ready" 2>/dev/null || true)
            if [[ "$BODY" == *'"status":"ready"'* ]]; then
              READY=1
              break
            fi
            sleep 5
          done
          if [[ -z "$READY" ]]; then
            echo "::error::${BASE_URL}/health/ready never reported ready"
            exit 1
          fi
          echo "town-api-capacity is ready."

      - name: Run 1 -- k6
        id: run1_k6
        continue-on-error: true
        run: |
          set -euo pipefail
          k6 run --summary-export=run1-k6-summary.json loadtest/capacity-1000.js

      - name: Run 1 -- verify
        id: run1_verify
        if: always()
        run: |
          set -euo pipefail
          UPDATE_INPUT='{"serviceId":"'"${API_SERVICE_ID}"'","environmentId":"'"${RAILWAY_ENVIRONMENT_ID}"'","input":{"startCommand":"node dist/scripts/capacity-verify.js","restartPolicyType":"NEVER"}}'
          UPDATE_RESPONSE=$(railway api \
            'mutation($serviceId: String!, $environmentId: String, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(serviceId: $serviceId, environmentId: $environmentId, input: $input) }' \
            --variables "$UPDATE_INPUT" \
            --allow-errors \
            --compact)
          echo "$UPDATE_RESPONSE"
          echo "$UPDATE_RESPONSE" | node -e "
            const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            if (d.errors) throw new Error('serviceInstanceUpdate GraphQL errors: ' + JSON.stringify(d.errors));
            if (d.data?.serviceInstanceUpdate !== true) throw new Error('unexpected serviceInstanceUpdate response shape: ' + JSON.stringify(d));
          "

          DEPLOY_INPUT='{"environmentId":"'"${RAILWAY_ENVIRONMENT_ID}"'","serviceId":"'"${API_SERVICE_ID}"'"}'
          DEPLOY_RESPONSE=$(railway api \
            'mutation($environmentId: String!, $serviceId: String!) { serviceInstanceDeployV2(environmentId: $environmentId, serviceId: $serviceId) }' \
            --variables "$DEPLOY_INPUT" \
            --allow-errors \
            --compact)
          echo "$DEPLOY_RESPONSE"
          DEPLOYMENT_ID=$(echo "$DEPLOY_RESPONSE" | node -e "
            const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            if (d.errors) throw new Error('serviceInstanceDeployV2 GraphQL errors: ' + JSON.stringify(d.errors));
            const id = d.data?.serviceInstanceDeployV2;
            if (!id) throw new Error('unexpected serviceInstanceDeployV2 response shape: ' + JSON.stringify(d));
            console.log(id);
          ")
          echo "Verify deployment ${DEPLOYMENT_ID} triggered"

          TERMINAL=""
          STATUS=""
          for tick in $(seq 1 240); do
            STATUS_RESPONSE=$(railway api \
              'query($id: String!) { deployment(id: $id) { status } }' \
              --variables "{\"id\":\"${DEPLOYMENT_ID}\"}" \
              --allow-errors \
              --compact)
            STATUS=$(echo "$STATUS_RESPONSE" | node -e "
              const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              if (d.errors) throw new Error('deployment query GraphQL errors: ' + JSON.stringify(d.errors));
              console.log(d.data?.deployment?.status ?? 'UNKNOWN');
            ")
            echo "Verify deployment status: ${STATUS}"
            case "$STATUS" in
              SUCCESS|FAILED|CRASHED|REMOVED)
                TERMINAL=1
                break
                ;;
            esac
            sleep 5
          done
          if [[ -z "$TERMINAL" ]]; then
            echo "::error::Run 1 verify deployment never reached a terminal status (last: ${STATUS})"
            echo "outcome=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          RESULT_MARKER=""
          for attempt in $(seq 1 12); do
            LOGS_RESPONSE=$(railway api \
              'query($deploymentId: String!, $limit: Int) { deploymentLogs(deploymentId: $deploymentId, limit: $limit) { message severity attributes { key value } } }' \
              --variables "{\"deploymentId\":\"${DEPLOYMENT_ID}\",\"limit\":500}" \
              --allow-errors \
              --compact)
            RESULT_MARKER=$(echo "$LOGS_RESPONSE" | node -e "
              const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              if (d.errors) throw new Error('deploymentLogs GraphQL errors: ' + JSON.stringify(d.errors));
              const logs = d.data?.deploymentLogs ?? [];
              let marker;
              for (const log of logs) {
                for (const a of (log.attributes || [])) {
                  if (a.key === 'capacityVerifyResult') {
                    marker = a.value;
                  }
                }
              }
              if (marker) process.stdout.write(marker);
            ")
            if [[ -n "$RESULT_MARKER" ]]; then
              break
            fi
            echo "capacityVerifyResult marker not available yet (attempt ${attempt}/12); waiting 5 seconds..."
            sleep 5
          done
          if [[ -z "$RESULT_MARKER" ]]; then
            echo "::error::capacityVerifyResult marker was not available within 60 seconds after deployment reached a terminal status"
            exit 1
          fi
          echo "$RESULT_MARKER" | node -e "
            const result = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            console.log('outcome=' + result.outcome);
            console.log('checks=' + JSON.stringify(result.checks ?? []));
            console.log('counts=' + JSON.stringify(result.counts ?? {}));
          " > run1-verify.txt
          cat run1-verify.txt
          OUTCOME=$(grep '^outcome=' run1-verify.txt | cut -d= -f2-)
          echo "outcome=${OUTCOME}" >> "$GITHUB_OUTPUT"
          if [[ "$OUTCOME" != "passed" ]]; then
            exit 1
          fi

      - name: Run 1 -- final outcome
        id: run1_final
        if: always()
        env:
          K6_OUTCOME: ${{ steps.run1_k6.outcome }}
          VERIFY_OUTCOME: ${{ steps.run1_verify.outputs.outcome || 'failed' }}
        run: |
          set -euo pipefail
          echo "Run 1 -- k6 step outcome: ${K6_OUTCOME}"
          echo "Run 1 -- verify outcome: ${VERIFY_OUTCOME}"
          if [[ "$K6_OUTCOME" == "success" && "$VERIFY_OUTCOME" == "passed" ]]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
            echo "Run 1 passed."
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "::error::Run 1 did not fully pass (k6=${K6_OUTCOME}, verify=${VERIFY_OUTCOME}) -- Run 2 will not start."
          fi

      # ---------------------------------------------------------------
      # Run 2 -- only if Run 1 fully passed
      # ---------------------------------------------------------------

      - name: Run 2 -- setup (reset schema, migrate, seed, provision fixtures)
        id: run2_setup
        if: steps.run1_final.outputs.passed == 'true'
        run: |
          set -euo pipefail
          UPDATE_INPUT='{"serviceId":"'"${API_SERVICE_ID}"'","environmentId":"'"${RAILWAY_ENVIRONMENT_ID}"'","input":{"startCommand":"node dist/scripts/capacity-setup.js","restartPolicyType":"NEVER"}}'
          UPDATE_RESPONSE=$(railway api \
            'mutation($serviceId: String!, $environmentId: String, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(serviceId: $serviceId, environmentId: $environmentId, input: $input) }' \
            --variables "$UPDATE_INPUT" \
            --allow-errors \
            --compact)
          echo "$UPDATE_RESPONSE"
          echo "$UPDATE_RESPONSE" | node -e "
            const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            if (d.errors) throw new Error('serviceInstanceUpdate GraphQL errors: ' + JSON.stringify(d.errors));
            if (d.data?.serviceInstanceUpdate !== true) throw new Error('unexpected serviceInstanceUpdate response shape: ' + JSON.stringify(d));
          "

          DEPLOY_INPUT='{"environmentId":"'"${RAILWAY_ENVIRONMENT_ID}"'","serviceId":"'"${API_SERVICE_ID}"'"}'
          DEPLOY_RESPONSE=$(railway api \
            'mutation($environmentId: String!, $serviceId: String!) { serviceInstanceDeployV2(environmentId: $environmentId, serviceId: $serviceId) }' \
            --variables "$DEPLOY_INPUT" \
            --allow-errors \
            --compact)
          echo "$DEPLOY_RESPONSE"
          DEPLOYMENT_ID=$(echo "$DEPLOY_RESPONSE" | node -e "
            const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            if (d.errors) throw new Error('serviceInstanceDeployV2 GraphQL errors: ' + JSON.stringify(d.errors));
            const id = d.data?.serviceInstanceDeployV2;
            if (!id) throw new Error('unexpected serviceInstanceDeployV2 response shape: ' + JSON.stringify(d));
            console.log(id);
          ")
          echo "Setup deployment ${DEPLOYMENT_ID} triggered"

          TERMINAL=""
          STATUS=""
          for tick in $(seq 1 240); do
            STATUS_RESPONSE=$(railway api \
              'query($id: String!) { deployment(id: $id) { status } }' \
              --variables "{\"id\":\"${DEPLOYMENT_ID}\"}" \
              --allow-errors \
              --compact)
            STATUS=$(echo "$STATUS_RESPONSE" | node -e "
              const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              if (d.errors) throw new Error('deployment query GraphQL errors: ' + JSON.stringify(d.errors));
              console.log(d.data?.deployment?.status ?? 'UNKNOWN');
            ")
            echo "Setup deployment status: ${STATUS}"
            case "$STATUS" in
              SUCCESS|FAILED|CRASHED|REMOVED)
                TERMINAL=1
                break
                ;;
            esac
            sleep 5
          done
          if [[ -z "$TERMINAL" ]]; then
            echo "::error::Run 2 setup deployment never reached a terminal status (last: ${STATUS})"
            exit 1
          fi

          RESULT_MARKER=""
          for attempt in $(seq 1 12); do
            LOGS_RESPONSE=$(railway api \
              'query($deploymentId: String!, $limit: Int) { deploymentLogs(deploymentId: $deploymentId, limit: $limit) { message severity attributes { key value } } }' \
              --variables "{\"deploymentId\":\"${DEPLOYMENT_ID}\",\"limit\":500}" \
              --allow-errors \
              --compact)
            RESULT_MARKER=$(echo "$LOGS_RESPONSE" | node -e "
              const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              if (d.errors) throw new Error('deploymentLogs GraphQL errors: ' + JSON.stringify(d.errors));
              const logs = d.data?.deploymentLogs ?? [];
              let marker;
              for (const log of logs) {
                for (const a of (log.attributes || [])) {
                  if (a.key === 'capacitySetupResult') {
                    marker = a.value;
                  }
                }
              }
              if (marker) process.stdout.write(marker);
            ")
            if [[ -n "$RESULT_MARKER" ]]; then
              break
            fi
            echo "capacitySetupResult marker not available yet (attempt ${attempt}/12); waiting 5 seconds..."
            sleep 5
          done
          if [[ -z "$RESULT_MARKER" ]]; then
            echo "::error::capacitySetupResult marker was not available within 60 seconds after deployment reached a terminal status"
            exit 1
          fi
          echo "$RESULT_MARKER" | node -e "
            const result = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            console.log('outcome=' + result.outcome);
            console.log('checks=' + JSON.stringify(result.checks ?? []));
            console.log('counts=' + JSON.stringify(result.counts ?? {}));
          " > run2-setup-result.txt
          cat run2-setup-result.txt
          OUTCOME=$(grep '^outcome=' run2-setup-result.txt | cut -d= -f2-)
          if [[ "$STATUS" != "SUCCESS" || "$OUTCOME" != "passed" ]]; then
            exit 1
          fi

      - name: Run 2 -- serve (boot the real API server)
        id: run2_serve
        if: steps.run1_final.outputs.passed == 'true'
        run: |
          set -euo pipefail
          UPDATE_INPUT='{"serviceId":"'"${API_SERVICE_ID}"'","environmentId":"'"${RAILWAY_ENVIRONMENT_ID}"'","input":{"startCommand":"node dist/server.js","restartPolicyType":"ON_FAILURE"}}'
          UPDATE_RESPONSE=$(railway api \
            'mutation($serviceId: String!, $environmentId: String, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(serviceId: $serviceId, environmentId: $environmentId, input: $input) }' \
            --variables "$UPDATE_INPUT" \
            --allow-errors \
            --compact)
          echo "$UPDATE_RESPONSE"
          echo "$UPDATE_RESPONSE" | node -e "
            const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            if (d.errors) throw new Error('serviceInstanceUpdate GraphQL errors: ' + JSON.stringify(d.errors));
            if (d.data?.serviceInstanceUpdate !== true) throw new Error('unexpected serviceInstanceUpdate response shape: ' + JSON.stringify(d));
          "

          DEPLOY_INPUT='{"environmentId":"'"${RAILWAY_ENVIRONMENT_ID}"'","serviceId":"'"${API_SERVICE_ID}"'"}'
          DEPLOY_RESPONSE=$(railway api \
            'mutation($environmentId: String!, $serviceId: String!) { serviceInstanceDeployV2(environmentId: $environmentId, serviceId: $serviceId) }' \
            --variables "$DEPLOY_INPUT" \
            --allow-errors \
            --compact)
          echo "$DEPLOY_RESPONSE"
          DEPLOYMENT_ID=$(echo "$DEPLOY_RESPONSE" | node -e "
            const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            if (d.errors) throw new Error('serviceInstanceDeployV2 GraphQL errors: ' + JSON.stringify(d.errors));
            const id = d.data?.serviceInstanceDeployV2;
            if (!id) throw new Error('unexpected serviceInstanceDeployV2 response shape: ' + JSON.stringify(d));
            console.log(id);
          ")
          echo "Serve deployment ${DEPLOYMENT_ID} triggered"

          TERMINAL=""
          STATUS=""
          for tick in $(seq 1 120); do
            STATUS_RESPONSE=$(railway api \
              'query($id: String!) { deployment(id: $id) { status } }' \
              --variables "{\"id\":\"${DEPLOYMENT_ID}\"}" \
              --allow-errors \
              --compact)
            STATUS=$(echo "$STATUS_RESPONSE" | node -e "
              const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              if (d.errors) throw new Error('deployment query GraphQL errors: ' + JSON.stringify(d.errors));
              console.log(d.data?.deployment?.status ?? 'UNKNOWN');
            ")
            echo "Serve deployment status: ${STATUS}"
            case "$STATUS" in
              SUCCESS|FAILED|CRASHED|REMOVED)
                TERMINAL=1
                break
                ;;
            esac
            sleep 5
          done
          if [[ -z "$TERMINAL" || "$STATUS" != "SUCCESS" ]]; then
            echo "::group::Deploy logs (diagnostic)"
            railway logs --service "${API_SERVICE_NAME}" --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --lines 200 || true
            echo "::endgroup::"
            echo "::error::Run 2 serve deployment did not reach SUCCESS (last: ${STATUS})"
            exit 1
          fi

      - name: Run 2 -- wait for /health/ready
        if: steps.run1_final.outputs.passed == 'true'
        run: |
          set -euo pipefail
          READY=""
          DEADLINE=$(( $(date -u +%s) + 5 * 60 ))
          while [[ "$(date -u +%s)" -lt "$DEADLINE" ]]; do
            BODY=$(curl -fsS "${BASE_URL}/health/ready" 2>/dev/null || true)
            if [[ "$BODY" == *'"status":"ready"'* ]]; then
              READY=1
              break
            fi
            sleep 5
          done
          if [[ -z "$READY" ]]; then
            echo "::error::${BASE_URL}/health/ready never reported ready"
            exit 1
          fi
          echo "town-api-capacity is ready."

      - name: Run 2 -- k6
        id: run2_k6
        if: steps.run1_final.outputs.passed == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          k6 run --summary-export=run2-k6-summary.json loadtest/capacity-1000.js

      - name: Run 2 -- verify
        id: run2_verify
        if: always() && steps.run1_final.outputs.passed == 'true'
        run: |
          set -euo pipefail
          UPDATE_INPUT='{"serviceId":"'"${API_SERVICE_ID}"'","environmentId":"'"${RAILWAY_ENVIRONMENT_ID}"'","input":{"startCommand":"node dist/scripts/capacity-verify.js","restartPolicyType":"NEVER"}}'
          UPDATE_RESPONSE=$(railway api \
            'mutation($serviceId: String!, $environmentId: String, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(serviceId: $serviceId, environmentId: $environmentId, input: $input) }' \
            --variables "$UPDATE_INPUT" \
            --allow-errors \
            --compact)
          echo "$UPDATE_RESPONSE"
          echo "$UPDATE_RESPONSE" | node -e "
            const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            if (d.errors) throw new Error('serviceInstanceUpdate GraphQL errors: ' + JSON.stringify(d.errors));
            if (d.data?.serviceInstanceUpdate !== true) throw new Error('unexpected serviceInstanceUpdate response shape: ' + JSON.stringify(d));
          "

          DEPLOY_INPUT='{"environmentId":"'"${RAILWAY_ENVIRONMENT_ID}"'","serviceId":"'"${API_SERVICE_ID}"'"}'
          DEPLOY_RESPONSE=$(railway api \
            'mutation($environmentId: String!, $serviceId: String!) { serviceInstanceDeployV2(environmentId: $environmentId, serviceId: $serviceId) }' \
            --variables "$DEPLOY_INPUT" \
            --allow-errors \
            --compact)
          echo "$DEPLOY_RESPONSE"
          DEPLOYMENT_ID=$(echo "$DEPLOY_RESPONSE" | node -e "
            const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            if (d.errors) throw new Error('serviceInstanceDeployV2 GraphQL errors: ' + JSON.stringify(d.errors));
            const id = d.data?.serviceInstanceDeployV2;
            if (!id) throw new Error('unexpected serviceInstanceDeployV2 response shape: ' + JSON.stringify(d));
            console.log(id);
          ")
          echo "Verify deployment ${DEPLOYMENT_ID} triggered"

          TERMINAL=""
          STATUS=""
          for tick in $(seq 1 240); do
            STATUS_RESPONSE=$(railway api \
              'query($id: String!) { deployment(id: $id) { status } }' \
              --variables "{\"id\":\"${DEPLOYMENT_ID}\"}" \
              --allow-errors \
              --compact)
            STATUS=$(echo "$STATUS_RESPONSE" | node -e "
              const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              if (d.errors) throw new Error('deployment query GraphQL errors: ' + JSON.stringify(d.errors));
              console.log(d.data?.deployment?.status ?? 'UNKNOWN');
            ")
            echo "Verify deployment status: ${STATUS}"
            case "$STATUS" in
              SUCCESS|FAILED|CRASHED|REMOVED)
                TERMINAL=1
                break
                ;;
            esac
            sleep 5
          done
          if [[ -z "$TERMINAL" ]]; then
            echo "::error::Run 2 verify deployment never reached a terminal status (last: ${STATUS})"
            echo "outcome=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          RESULT_MARKER=""
          for attempt in $(seq 1 12); do
            LOGS_RESPONSE=$(railway api \
              'query($deploymentId: String!, $limit: Int) { deploymentLogs(deploymentId: $deploymentId, limit: $limit) { message severity attributes { key value } } }' \
              --variables "{\"deploymentId\":\"${DEPLOYMENT_ID}\",\"limit\":500}" \
              --allow-errors \
              --compact)
            RESULT_MARKER=$(echo "$LOGS_RESPONSE" | node -e "
              const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              if (d.errors) throw new Error('deploymentLogs GraphQL errors: ' + JSON.stringify(d.errors));
              const logs = d.data?.deploymentLogs ?? [];
              let marker;
              for (const log of logs) {
                for (const a of (log.attributes || [])) {
                  if (a.key === 'capacityVerifyResult') {
                    marker = a.value;
                  }
                }
              }
              if (marker) process.stdout.write(marker);
            ")
            if [[ -n "$RESULT_MARKER" ]]; then
              break
            fi
            echo "capacityVerifyResult marker not available yet (attempt ${attempt}/12); waiting 5 seconds..."
            sleep 5
          done
          if [[ -z "$RESULT_MARKER" ]]; then
            echo "::error::capacityVerifyResult marker was not available within 60 seconds after deployment reached a terminal status"
            exit 1
          fi
          echo "$RESULT_MARKER" | node -e "
            const result = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            console.log('outcome=' + result.outcome);
            console.log('checks=' + JSON.stringify(result.checks ?? []));
            console.log('counts=' + JSON.stringify(result.counts ?? {}));
          " > run2-verify.txt
          cat run2-verify.txt
          OUTCOME=$(grep '^outcome=' run2-verify.txt | cut -d= -f2-)
          echo "outcome=${OUTCOME}" >> "$GITHUB_OUTPUT"
          if [[ "$OUTCOME" != "passed" ]]; then
            exit 1
          fi

      - name: Run 2 -- final outcome
        id: run2_final
        if: always() && steps.run1_final.outputs.passed == 'true'
        env:
          K6_OUTCOME: ${{ steps.run2_k6.outcome }}
          VERIFY_OUTCOME: ${{ steps.run2_verify.outputs.outcome || 'failed' }}
        run: |
          set -euo pipefail
          echo "Run 2 -- k6 step outcome: ${K6_OUTCOME}"
          echo "Run 2 -- verify outcome: ${VERIFY_OUTCOME}"
          if [[ "$K6_OUTCOME" == "success" && "$VERIFY_OUTCOME" == "passed" ]]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
            echo "Run 2 passed."
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "::error::Run 2 did not fully pass (k6=${K6_OUTCOME}, verify=${VERIFY_OUTCOME})"
          fi

      # ---------------------------------------------------------------
      # Reporting
      # ---------------------------------------------------------------

      - name: Write job summary
        if: always()
        env:
          RUN1_PASSED: ${{ steps.run1_final.outputs.passed || 'false' }}
          RUN2_PASSED: ${{ steps.run2_final.outputs.passed || 'not_started' }}
        run: |
          set -euo pipefail
          {
            echo "# Etapa 4 capacity drill -- run ${{ github.run_id }}"
            echo
            echo "Commit: ${{ github.sha }} -- environment: capacity"
            echo
            echo "## Run 1 (passed=${RUN1_PASSED})"
            echo '```json'
            cat run1-k6-summary.json 2>/dev/null || echo '(missing)'
            echo '```'
            echo '```json'
            cat run1-verify.txt 2>/dev/null || echo '(missing)'
            echo '```'
            echo
            echo "## Run 2 (passed=${RUN2_PASSED})"
            if [[ "$RUN1_PASSED" != "true" ]]; then
              echo "Not started -- Run 1 did not fully pass."
            else
              echo '```json'
              cat run2-k6-summary.json 2>/dev/null || echo '(missing)'
              echo '```'
              echo '```json'
              cat run2-verify.txt 2>/dev/null || echo '(missing)'
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capacity-drill-${{ github.run_id }}
          retention-days: 30
          path: |
            run1-setup-result.txt
            run1-k6-summary.json
            run1-verify.txt
            run2-setup-result.txt
            run2-k6-summary.json
            run2-verify.txt
          if-no-files-found: warn

      - name: Final outcome
        if: always()
        env:
          RUN1_PASSED: ${{ steps.run1_final.outputs.passed || 'false' }}
          RUN2_PASSED: ${{ steps.run2_final.outputs.passed || 'false' }}
        run: |
          set -euo pipefail
          echo "Run 1 passed: ${RUN1_PASSED}"
          echo "Run 2 passed: ${RUN2_PASSED}"
          if [[ "$RUN1_PASSED" != "true" || "$RUN2_PASSED" != "true" ]]; then
            echo "::error::Capacity drill did not fully pass both runs (run1=${RUN1_PASSED}, run2=${RUN2_PASSED})"
            exit 1
          fi
          echo "Capacity drill passed both runs."
